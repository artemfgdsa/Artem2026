<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анкета → DOCX</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f2f4f8;
      margin: 0;
      padding: 24px 16px;
      color: #1f2937;
    }
    .card {
      max-width: 480px;
      margin: 0 auto;
      background: #fff;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 20px; font-size: 24px; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; font-size: 14px; }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    textarea { min-height: 110px; resize: vertical; }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Анкета</h1>

    <!-- Данные сохраняются на сервере; готовый DOCX скачивает только владелец на странице /admin -->
    <form action="/generate" method="POST">
      <label for="name">Фамилия</label>
      <input type="text" id="name" name="name" required>

      <label for="age">Номер взвода</label>
      <input type="number" id="age" name="age" min="0" max="150">

      <label for="phone">Телефон</label>
      <input type="text" id="phone" name="phone">

      <label for="comment">Комментарий</label>
      <textarea id="comment" name="comment"></textarea>

      <!-- Скрытая «ловушка» для спам-ботов: людям она не видна -->
      <input type="text" name="website" tabindex="-1" autocomplete="off"
             style="position:absolute;left:-9999px;" aria-hidden="true">

      <button type="submit">Отправить</button>
    </form>
  </div>
</body>
</html>
